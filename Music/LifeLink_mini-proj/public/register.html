<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LifeLink - Register as Blood Donor</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  <header id="main-nav"></header>

  <main class="container">
    <div class="card" style="max-width: 600px; margin: 0 auto;">
      <h1 class="card-title">Become a Blood Donor</h1>
      <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 20px;">
        Register your blood group to help save lives in your area.
      </p>

      <form id="register-form">
        <div class="form-group">
          <label for="name">Full Name *</label>
          <input type="text" id="name" required minlength="2" maxlength="60" placeholder="e.g. John Doe">
        </div>

        <div class="form-row">
          <div class="form-group" style="flex: 1;">
            <label for="gender">Gender *</label>
            <select id="gender" required>
              <option value="">Select...</option>
              <option value="male">Male</option>
              <option value="female">Female</option>
              <option value="other">Other</option>
            </select>
          </div>

          <div class="form-group" style="flex: 1;">
            <label for="blood-group">Blood Group *</label>
            <select id="blood-group" required>
              <option value="">Select...</option>
              <option value="A+">A+</option>
              <option value="A-">A-</option>
              <option value="B+">B+</option>
              <option value="B-">B-</option>
              <option value="AB+">AB+</option>
              <option value="AB-">AB-</option>
              <option value="O+">O+</option>
              <option value="O-">O-</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number *</label>
          <input type="tel" id="phone" required pattern="^\+?\d{10,13}$" placeholder="e.g. 9876543210">
        </div>

        <div class="form-group">
          <label for="city-select">City *</label>
          <select id="city-select" required></select>
        </div>

        <div class="form-group">
          <label>Location Coordinates (Drag map marker or click GPS)</label>
          <div style="display: flex; gap: 8px; margin-bottom: 8px;">
            <button type="button" id="gps-btn" class="btn btn-sm btn-secondary">📍 Use my GPS</button>
            <span id="coords-text" style="font-size: 0.85rem; color: var(--text-muted); align-self: center;">
              Default: City Center
            </span>
          </div>
          <div id="register-map" class="map-container" style="height: 220px;"></div>
        </div>

        <div class="form-group">
          <label for="last-donation">Last Donation Date (Optional)</label>
          <input type="date" id="last-donation">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
          Register as Donor
        </button>
      </form>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="/js/common.js"></script>
  <script type="module" src="/js/register.js"></script>
</body>
</html>
