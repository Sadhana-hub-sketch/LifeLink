<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LifeLink - Analytics & Reports</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header id="main-nav"></header>

  <main class="container">
    <h1 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 20px;">System Analytics & Reports</h1>

    <!-- Summary Stat Tiles -->
    <div class="grid-4" style="margin-bottom: 20px;">
      <div class="card" style="text-align: center; margin-bottom: 0;">
        <div style="font-size: 0.85rem; color: var(--text-muted); font-weight: 600;">TOTAL DONORS</div>
        <div id="stat-total-donors" style="font-size: 2rem; font-weight: 800; color: var(--text-main);">0</div>
      </div>

      <div class="card" style="text-align: center; margin-bottom: 0;">
        <div style="font-size: 0.85rem; color: var(--text-muted); font-weight: 600;">ELIGIBLE NOW</div>
        <div id="stat-eligible-now" style="font-size: 2rem; font-weight: 800; color: var(--green-text);">0</div>
      </div>

      <div class="card" style="text-align: center; margin-bottom: 0;">
        <div style="font-size: 0.85rem; color: var(--text-muted); font-weight: 600;">ACTIVE REQUESTS</div>
        <div id="stat-active-requests" style="font-size: 2rem; font-weight: 800; color: var(--primary-red);">0</div>
      </div>

      <div class="card" style="text-align: center; margin-bottom: 0;">
        <div style="font-size: 0.85rem; color: var(--text-muted); font-weight: 600;">DONATIONS (30 DAYS)</div>
        <div id="stat-donations-30days" style="font-size: 2rem; font-weight: 800; color: var(--amber-text);">0</div>
      </div>
    </div>

    <!-- Charts Row 1 -->
    <div class="grid-2">
      <div class="card">
        <h2 class="card-title">Donors by Blood Group</h2>
        <div id="chart-donors-group">Loading...</div>
      </div>

      <div class="card">
        <h2 class="card-title">Donors by City</h2>
        <div id="chart-donors-city">Loading...</div>
      </div>
    </div>

    <!-- Charts Row 2 -->
    <div class="grid-2">
      <div class="card">
        <h2 class="card-title">Most Requested Blood Groups</h2>
        <div id="chart-requests-group">Loading...</div>
      </div>

      <div class="card">
        <h2 class="card-title">Top Donors Hall of Fame 🏆</h2>
        <div id="top-donors-container">Loading...</div>
      </div>
    </div>
  </main>

  <script type="module" src="/js/common.js"></script>
  <script type="module" src="/js/reports.js"></script>
</body>
</html>
