<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LifeLink - Find Blood Donors</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  <header id="main-nav"></header>

  <main class="container">
    <div class="card">
      <h1 class="card-title">Find Compatible Blood Donors</h1>
      <form id="search-form">
        <div class="form-row">
          <div class="form-group" style="flex: 1;">
            <label for="blood-group">Recipient Blood Group</label>
            <select id="blood-group" required>
              <option value="">Select Group...</option>
              <option value="A+">A+</option>
              <option value="A-">A-</option>
              <option value="B+">B+</option>
              <option value="B-">B-</option>
              <option value="AB+">AB+</option>
              <option value="AB-">AB-</option>
              <option value="O+">O+</option>
              <option value="O-">O-</option>
            </select>
          </div>

          <div class="form-group" style="flex: 1.5;">
            <label for="city-select">City / Location</label>
            <select id="city-select"></select>
          </div>

          <div class="form-group" style="align-self: flex-end;">
            <button type="button" id="geo-btn" class="btn btn-secondary" title="Use current GPS location">
              📍 GPS
            </button>
          </div>

          <div class="form-group" style="align-self: flex-end;">
            <button type="submit" class="btn btn-primary" style="width: 100%;">
              🔍 Search
            </button>
          </div>
        </div>
        <input type="hidden" id="geo-lat" value="">
        <input type="hidden" id="geo-lng" value="">
      </form>
    </div>

    <!-- Expansion Alert Banner -->
    <div id="expansion-notice" class="card" style="display: none; background-color: var(--amber-bg); border-color: #f6e05e; color: var(--amber-text); padding: 12px 16px;">
      <span id="expansion-text"></span>
    </div>

    <!-- Map & Results Container -->
    <div id="results-wrapper" style="display: none;">
      <div id="search-map" class="map-container"></div>
      <div id="donors-list"></div>
    </div>

    <!-- Empty State -->
    <div id="empty-state" class="empty-state" style="display: none;">
      <h3>No compatible donors found nearby</h3>
      <p>Try searching in a wider area, selecting a different city, or post an urgent blood request.</p>
      <div style="margin-top: 16px;">
        <a href="requests.html" class="btn btn-primary">Post Blood Request</a>
      </div>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="/js/common.js"></script>
  <script type="module" src="/js/search.js"></script>
</body>
</html>
